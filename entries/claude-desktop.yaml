tagline: Anthropic's desktop app for Claude — chat, Cowork for long-running agentic tasks, and Claude Code in one app, with connectors (MCP), skills and plugins.

description: |
  Claude Desktop is Anthropic's native app for macOS and Windows, with a
  Linux beta for Ubuntu 22.04+ and Debian 12+. It combines three surfaces
  in one window. Chat is for conversations. Cowork is for longer agentic
  work that can keep running after you close your laptop; on Linux it
  runs tasks in a local QEMU/KVM virtual machine. Claude Code adds
  parallel coding sessions, visual diff review, and an integrated
  terminal and editor. In September 2026 Anthropic began merging chat
  and Cowork into a single Claude experience on Pro and Max plans.

  Claude can be extended with connectors (MCP servers), skills and
  plugins, and it can use a built-in browser and, with permission, your
  computer. It runs on Anthropic's Claude model families (Mythos, Fable,
  Opus, Sonnet, Haiku). End-user documentation is indexed at
  claude.com/docs/llms.txt and the Help Center at
  support.claude.com/llms.txt.

features:
  - Native apps for macOS and Windows; Linux beta (Ubuntu/Debian, x86_64 and arm64)
  - Chat, Cowork (long-running agentic tasks, scheduled tasks) and Claude Code in one app
  - Connectors (MCP servers), skills and plugins
  - Built-in browser and computer use in Cowork
  - Claude Code desktop — parallel sessions, diff review, integrated terminal and editor
  - Claude Docs, Slides and Design created inside conversations (beta, paid plans)
  - Claude Mythos, Fable, Opus, Sonnet and Haiku model families

use_cases:
  - Daily AI assistant with access to local files and tools via MCP
  - Power-user chat with full tool use (browser, shell, APIs)
  - Workflow automation via custom skills
  - Research, writing, and coding assistance at the desktop
  - Users who want Claude's capabilities beyond the web UI

