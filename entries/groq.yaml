tagline: Fast-inference "neocloud" — GroqCloud's OpenAI-compatible API on Groq LPUs alongside NVIDIA accelerated computing.

description: |
  Groq runs GroqCloud, an inference cloud with an OpenAI-compatible API.
  Groq pioneered its own Language Processing Unit (LPU) silicon. It now
  runs LPUs alongside NVIDIA accelerated computing as an NVIDIA Cloud
  Partner, across 13 data centers in North America, Europe, the Middle
  East and Asia Pacific. It raised a $350M Series A in August 2026.

  The API is OpenAI-compatible, so OpenAI-client code can switch with a
  base-URL change. Latency remains the main selling point, with hundreds
  to about a thousand tokens per second on hosted models. GroqCloud is
  common for voice agents, streaming chat and agent loops with many
  sequential calls.

features:
  - OpenAI-compatible API with streaming, tool use and structured outputs
  - Roughly 280–1,000 tokens/sec on production models
  - Production models include gpt-oss 120B/20B, Llama 3.x and Whisper large-v3 / turbo
  - Preview models such as Qwen 3.8 27B, MiniMax M2.7 and Orpheus TTS
  - Speech-to-text, text-to-speech and vision
  - Batch API for async high-volume jobs
  - Free tier for prototyping

use_cases:
  - Real-time voice agents and conversational AI
  - Streaming chat UIs where time-to-first-token matters
  - Agent loops with many sequential LLM calls (speed compounds)
  - Live coding assistants (inline autocomplete, fast chat)
  - High-throughput inference pipelines with latency SLOs

