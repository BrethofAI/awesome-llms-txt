tagline: Web APIs for AI agents — Search, Extract, Task / Deep Research, FindAll and Monitor — returning LLM-optimized excerpts.

description: |
  Parallel offers web-access APIs designed for AI agents rather than humans. Search
  returns LLM-optimized excerpts for natural-language objectives. Extract pulls clean
  content from URLs. The Task API runs deep research and data enrichment. FindAll
  discovers entities matching criteria, and Monitor watches the web for changes.

  The docs include migration guides from Exa, Tavily and SERP APIs and an evaluation
  guide for comparing search quality inside an agent.

features:
  - Search API with LLM-optimized excerpts and search modes
  - Extract API for page content
  - Task API for deep research and enrichment
  - FindAll entity discovery and Monitor change tracking
  - Responses / chat-style endpoint

use_cases:
  - Grounding agents in fresh web results
  - Automated deep research and enrichment pipelines
  - Monitoring sites or topics for changes

