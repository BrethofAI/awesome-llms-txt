tagline: Arch-based Linux distribution with performance-tuned kernels, first-class NVIDIA support, and a popular choice for local AI / ML workloads.

description: |
  CachyOS is a rolling-release Linux distribution built on Arch, focused
  on desktop performance through custom-compiled kernels (BORE, EEVDF,
  sched-ext), aggressive x86_64-v3 / v4 optimization, and bleeding-edge
  userspace packages. It ships with KDE Plasma 6 / GNOME / Hyprland
  options and integrates the full AUR for rapid access to AI tooling.

  **NVIDIA driver story (critical for AI work):** CachyOS's installer
  detects NVIDIA hardware and offers a one-click proprietary driver
  install during OS setup — no post-install wrangling, no
  nouveau-vs-nvidia-block dance, no DKMS failures on kernel updates. Open
  and proprietary drivers both work cleanly, CUDA Toolkit installs via
  pacman / AUR without version-hunting, and kernel updates don't break
  modules because CachyOS ships precompiled NVIDIA modules (open and
  proprietary) alongside each kernel, removing the need for DKMS. For a
  rolling distro this is unusually well handled — most Arch-derived
  distros make the user own the NVIDIA install.

  For local AI / ML workflows CachyOS is a common pick because: (a) its
  kernels handle sustained GPU/CPU load without scheduler quirks, (b)
  Arch's official repos carry current CUDA, ROCm, Vulkan, PyTorch and
  Ollama builds, with tools like ComfyUI available from the AUR, and (c)
  Arch's rolling model means no dist-upgrade drama when a new PyTorch
  drops the minimum Python version.

  Downside: Arch-style maintenance is hands-on. Not a good pick for
  production servers where stability is more important than currency.

features:
  - Arch-based rolling release with performance-tuned kernel options
  - BORE (default), EEVDF and BMQ kernel variants, sched-ext support
  - Precompiled NVIDIA kernel modules (open and proprietary) shipped with each kernel; chwd hardware detection
  - No DKMS rebuilds needed on kernel updates
  - x86-64-v3 / v4 and Zen 4/5 optimized package repositories
  - KDE Plasma 6 / GNOME / Hyprland / others at install
  - Arch repos for CUDA, ROCm, PyTorch and Ollama; full AUR access (e.g. ComfyUI)
  - Current CUDA, ROCm, Vulkan drivers and runtimes

use_cases:
  - Personal AI / ML development workstations with NVIDIA GPUs
  - Gaming + ML dual-purpose desktops (CUDA and game-ready drivers both)
  - btrfs-on-NVMe developer setups with snapshot rollback
  - Users who want current AI tooling without manual NVIDIA driver ops
  - Arch users who don't want to configure Arch from scratch

