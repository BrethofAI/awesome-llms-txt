tagline: Second-pass editing for transcripts — reads your text against its audio and hands back clean text.

description: |
  Verbaia is a Windows desktop tool that takes a transcript and its audio
  and goes over them a second time: it reads the words against the sound
  and catches what the first pass left behind — the wrong words, names,
  and numbers — then hands back a clean text copy. It is not a first-pass
  transcription service; it is the second pass after any transcription
  source, human or machine.

  It runs entirely on the buyer's own machine — no internet connection
  needed to use it — and works on text alone or text paired with its
  audio. The free trial is the full product for 7 days on a light account
  (email and password, no credit card). It is a one-time purchase with a
  license key that never expires ([shop](https://verbaia.com/verbaia-shop));
  a Mac version is in test.

features:
  - Second-pass checking of transcript text against its audio
  - Catches wrong words, names, and numbers left by the first pass
  - Works with transcripts from any source, text alone or paired with audio
  - Runs fully locally on Windows 10/11 — no internet needed to use it
  - Free 7-day full-product trial; one-time purchase, license never expires

use_cases:
  - Cleaning up AI or human transcripts before publishing or captioning
  - Podcasters and creators fixing names and numbers in episode transcripts
  - Accessibility workflows that need verified, accurate text
  - Anyone who needs a second pair of ears on recorded speech

