tagline: Per-minute GPU rental (RTX 4090, RTX 5090, A100) and an OpenAI-compatible model API on one prepaid balance.

description: |
  CloudGPU is a marketplace for renting GPUs (RTX 4090, RTX 5090 and
  A100) by the minute, and an OpenAI-compatible model API, both paid from
  one prepaid balance. The machines come from CloudGPU's partner
  suppliers and independent hosts. Developers use it for AI training, model inference, and
  ComfyUI workflows. REST and MCP tools are available so an agent or
  application can quote a GPU, start a job after confirmation,
  download results, and shut the instance down.

  Access uses a CloudGPU account and API key, or a browser-approved
  connect-account flow with a spending limit. Job files and prompts
  are sent to CloudGPU's API. Usage is paid and metered, from a balance
  topped up by card or USDT (TRC-20)
  ([pricing](https://cloudgpu.app/pricing)). Destroying an instance erases
  its local disk, so results must be downloaded first.

features:
  - Per-minute RTX 4090, RTX 5090 and A100 rental for training, inference, and ComfyUI workflows
  - OpenAI-compatible model API
  - REST and MCP tools for quoting, starting, and shutting down GPU jobs
  - Confirmation required before a billable GPU is started
  - Official llms.txt and llms-full.txt at the site root

use_cases:
  - Renting a GPU to run a training or inference job and shutting it down after
  - Pointing an OpenAI-compatible client at a model API
  - Driving GPU jobs from an MCP client with an explicit confirmation step
  - Running ComfyUI workflows on a rented GPU

