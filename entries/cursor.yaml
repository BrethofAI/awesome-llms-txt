tagline: AI coding agent and editor from Anysphere (acquired by SpaceX in 2026) — desktop app, CLI and cloud agents with a multi-vendor model picker.

description: |
  Cursor is an AI coding agent and editor built by Anysphere. SpaceX
  completed its acquisition of Cursor on 2026-08-14, following a
  model-training partnership with SpaceXAI announced in April 2026.

  The desktop app is a VS Code-based editor with agent mode, inline
  edits, Tab autocomplete and codebase-aware context. Around it Cursor
  now ships a CLI agent, cloud agents that run in parallel on their own
  machines (or on machines you manage) and hand back work for review,
  integrations with Slack and GitHub, a mobile app, automations, and
  review bots for pull requests.

  The model picker spans OpenAI, Anthropic, Google Gemini, SpaceXAI
  (Grok) and Cursor's own Composer models. Cursor is closed-source and
  subscription-based, with a free tier.

features:
  - Desktop editor (VS Code-based) with agent mode, inline edits and Tab autocomplete
  - Cursor CLI agent
  - Cloud agents running in parallel, including on self-managed machines
  - Slack and GitHub integrations, review bots and automations
  - Model choice across OpenAI, Anthropic, Gemini, SpaceXAI (Grok) and Cursor's Composer models
  - Codebase-wide semantic search and @-context references

use_cases:
  - Professional developers who want maximum AI integration
  - Teams that want a consistent IDE across members with built-in AI
  - Large refactors that benefit from multi-file agent coordination
  - Developers migrating from pure VS Code who want more AI than extensions provide

