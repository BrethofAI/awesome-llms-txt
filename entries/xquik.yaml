description: |
  Xquik supports public X data search, structured exports, account and topic
  monitoring, signed webhooks, giveaway draws, and connected-account actions.
  AI agents can use its hosted Streamable HTTP MCP endpoint, while applications
  can integrate through its REST API, OpenAPI 3.1 schema, and public SDKs.

  Xquik is an independent third-party service. Not affiliated with X Corp.
  "Twitter" and "X" are trademarks of X Corp.

features:
  - Search public posts, accounts, replies, mentions, reposts, lists, and follower data
  - Export results as CSV, XLSX, JSON, or Markdown
  - Monitor accounts or topics and receive signed webhook events
  - Connect AI agents through a hosted Streamable HTTP MCP endpoint
  - Integrate through an OpenAPI 3.1 schema and public SDKs

use_cases:
  - Research public X conversations and accounts
  - Automate monitoring, exports, and connected-account workflows
  - Give AI agents access to structured X data and actions

