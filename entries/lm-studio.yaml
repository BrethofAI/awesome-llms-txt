tagline: Desktop app for running local LLMs (llama.cpp and MLX) with an OpenAI-compatible server — now with Bionic, an agent for work and code, and optional US-hosted open-model inference.

description: |
  LM Studio is a desktop application for running open-weight LLMs on your
  own machine. It handles model discovery and download from Hugging Face,
  per-model GPU and context configuration, and chat. Its OpenAI-compatible
  local server and `lms` CLI let coding agents and other apps use whatever
  model is loaded. The runtime uses llama.cpp, plus Apple's MLX on Apple
  Silicon.

  In 2026 the app became LM Studio Bionic, built around Bionic, "LM
  Studio's agent for open models". Bionic creates and edits documents,
  helps with code, runs automations and can control the computer, and it
  includes local real-time voice transcription. Local use stays free.
  Paid plans (Bionic+ at $20/month and Pro at $100/month) add
  US-hosted, zero-data-retention inference for large open models such as
  Kimi K3, GLM 5.3 and DeepSeek V4, plus web search. LM Link connects
  multiple devices.

features:
  - Desktop GUI for Hugging Face model browsing, download and configuration
  - Bionic agent for documents, coding, automations and computer control
  - OpenAI-compatible local server and `lms` CLI; lmstudio-js and lmstudio-python SDKs
  - llama.cpp and MLX backends
  - Local real-time voice transcription
  - Optional US-hosted, zero-data-retention cloud inference for large open models (paid plans)
  - LM Link to share models across devices

use_cases:
  - Non-CLI users who want to run local LLMs with a GUI
  - Evaluating models side-by-side before committing to one
  - Private chat assistants for knowledge work
  - Local backend for coding assistants (Continue, Cursor via OpenAI proxy)
  - Teams piloting local LLMs before deploying server-side

