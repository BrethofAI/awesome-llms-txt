category: voice
tagline: Transcribe recordings and public video links into editable text and timed captions.
description: |
  FastScribe accepts audio files, video files and supported public video links
  and produces a transcript that can be reviewed in the browser. The output
  includes timestamps and speaker labels. A remote MCP server can transcribe
  supported public video links and retrieve completed transcripts.
features:
  - Export transcripts as TXT, DOCX or XLSX and captions as SRT.
  - Review timestamped text with automatically assigned speaker labels.
  - Retrieve transcripts and subtitle files from a compatible MCP client.
use_cases:
  - Extract interview quotations from a recording.
  - Create subtitle files for training videos and recorded presentations.
