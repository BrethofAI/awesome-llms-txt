tagline: MongoDB's Voyage AI embedding and reranking API — text, contextualized-chunk and multimodal embeddings for retrieval and RAG.

description: |
  Voyage AI, now "Voyage AI by MongoDB", provides hosted embedding
  models and rerankers through an API and Python client. The catalog
  includes text embeddings, contextualized chunk embeddings (chunks
  embedded with document context), multimodal embeddings and rerankers.
  Flexible output dimensions and quantization reduce storage cost, and
  a batch inference API handles large offline jobs.

  Voyage models also power retrieval inside MongoDB's data platform.
  The API is commonly used as the embedding step in RAG stacks paired
  with any vector database.

features:
  - Text, contextualized-chunk and multimodal embedding models
  - Rerankers
  - Flexible dimensions and quantized outputs
  - Batch inference API
  - Python client; organizations, projects and published SLOs

use_cases:
  - Embedding and reranking for RAG and semantic search
  - Document retrieval where chunk context matters
  - Teams already on MongoDB Atlas

