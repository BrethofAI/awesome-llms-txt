tagline: 'Offline voice-to-text, translation and subtitles for Linux and Windows: 30 transcription languages,
  38 for translation, LoRA voice training.'
description: 'Brethof Voice Pro is a commercial desktop app for Linux and Windows that transcribes, translates

  and subtitles speech entirely on the user''s own machine. Transcription runs on the open-source

  Qwen3-ASR engine (0.6B or 1.7B) in 30 languages, and recognises 22 Chinese regional dialects on its
  own;

  translation across 38 languages runs locally on Tencent''s Hunyuan MT2. It runs on the CPU or any

  Vulkan 1.2+ GPU (NVIDIA, AMD, Intel) — no CUDA required.


  It types wherever the cursor is (the transcript or its translation), records the microphone, a file
  or

  system audio, and exports text, SRT and VTT subtitles whose timings survive translation. Voice training

  learns from the corrections the user already makes, and an MCP server lets AI agents transcribe and

  translate locally (both on paid licences). The network is touched only by a licence check, an update

  check and the model downloads the user starts. Perpetual licence; 14-day free trial.

  '
features:
- Transcription in 30 languages plus 22 Chinese dialects (Qwen3-ASR 0.6B / 1.7B)
- Offline translation across 38 languages (Tencent Hunyuan MT2), multi-target and bilingual output
- Text, SRT and VTT subtitles; translating a subtitle file keeps every timing
- 'Voice keyboard: types the transcript or its translation into any app'
- Microphone, audio/video file, or system-audio input
- LoRA voice training from the user's own corrections; hotwords steer ASR and translation
- MCP server for AI agents (paid licence)
- Vulkan GPU inference (NVIDIA / AMD / Intel) or CPU-only; optional noise reduction
use_cases:
- Private dictation into any app
- Meeting and interview transcripts where cloud upload is unacceptable
- Subtitling and translating your own videos without per-minute fees
- 'Live translation while typing: speak one language, type another'
- Giving an AI agent local transcription and translation through MCP
