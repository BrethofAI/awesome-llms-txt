tagline: Open-source (MIT) personal AI assistant that runs on your own machine and answers you in the chat apps you already use — one self-hosted Gateway, any model.

description: |
  OpenClaw is an open-source personal AI assistant. You run one Gateway
  process on your own computer or server, connect it to the messaging apps
  you already use — WhatsApp, Telegram, Slack, Discord, Signal, iMessage,
  Microsoft Teams, Matrix and many more — and talk to your agent from
  anywhere. The agent acts for you: it can work through email and
  calendar, run scheduled automations, drive a browser, and use skills
  and plugins.

  It is model-agnostic. Bundled provider plugins cover the major model
  APIs, and custom providers point it at local inference servers. Skills
  and plugins are shared through ClawHub. Desktop apps for macOS, Windows
  and Linux install the Gateway together with a chat and configuration
  Control UI, and iOS and Android companion apps pair as device nodes.

  OpenClaw is MIT-licensed and, since July 2026, stewarded by the
  OpenClaw Foundation, an independent 501(c)(3) non-profit. There is no
  paid or hosted tier, and default telemetry is limited to a version
  check you can turn off. Its creator, Peter Steinberger, joined OpenAI
  in 2026 and continues to lead the project.

features:
  - Self-hosted Gateway with 20+ chat channels (WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Teams, Matrix, …)
  - Any model provider via bundled provider plugins, custom endpoints and local inference servers
  - Skills and plugins distributed through the ClawHub marketplace
  - Automations — scheduled jobs, webhooks, Gmail Pub/Sub and IMAP triggers, standing orders
  - Long-term memory, multi-agent routing and subagents
  - Browser control, voice, and paired device nodes (camera, screen, location)
  - MCP servers and an A2A channel for external agents
  - Desktop apps for macOS, Windows and Linux; iOS and Android companion apps; browser Control UI

use_cases:
  - A personal assistant you message from your phone that runs on hardware you control
  - Recurring chores (inbox, calendar, reports) handled by scheduled automations
  - A shared team assistant in Slack, Teams or Discord without a hosted vendor in the middle
  - Running a personal agent on local or self-chosen models

