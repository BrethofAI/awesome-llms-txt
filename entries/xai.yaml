tagline: SpaceXAI (formerly xAI) Grok API for reasoning, code, voice, image and video models, usable with the OpenAI SDK.

description: |
  SpaceXAI, the company formerly branded xAI, builds the Grok family of
  models and sells access through a developer API at api.x.ai, with docs
  at docs.x.ai. The x.ai site and the API documentation now both carry the
  SpaceXAI name. Its newest model is Grok 4.7.

  The API covers text generation with streaming, reasoning and structured
  outputs, and image understanding. Tools include function calling, code
  execution and collections search for RAG. The Imagine endpoints handle
  image generation and editing plus video generation, editing and
  extension. The Voice endpoints cover speech-to-speech (including SIP
  phone calls), text-to-speech, speech-to-text and custom voices.

  Existing OpenAI-SDK code works too: the quickstart shows the official
  OpenAI Python and JavaScript SDKs next to xAI's own SDK. For
  high-volume jobs there are a Batch API and deferred completions. Every
  documentation page is also available as Markdown by appending `.md`.

features:
  - Grok model family, newest model Grok 4.7
  - Works with the OpenAI SDKs as well as the native xAI SDK
  - Streaming, reasoning and structured outputs
  - Tools including function calling, code execution and collections search (RAG)
  - Image and video generation and editing (Imagine)
  - Voice APIs covering speech-to-speech, text-to-speech, speech-to-text and custom voices
  - Batch API and deferred completions for asynchronous workloads
  - Markdown versions of every docs page for agent ingestion

use_cases:
  - Agent and coding workloads that want a Grok model as a primary or fallback provider
  - Real-time voice agents, including phone calls over SIP
  - Multimodal apps that need text, image and video generation from one provider
  - Multi-provider stacks that already use the OpenAI SDK

