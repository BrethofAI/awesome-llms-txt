category: coding-agents
tagline: Local-first desktop workspace for structured AI-assisted software development.
description: |
  CycleCode is a local-first desktop workspace for developers and small teams building with AI agents. It connects product artifacts (Vision, PRD, Architecture, Stories, Acceptance Criteria) to scoped work items with approval gates, isolated Git worktrees, and recorded validation checks.
features:
  - Approval-gated SDLC workflow from Discovery and PRD to Architecture and Work Items
  - Isolated Git worktrees and allowed_files scope enforcement for AI-generated edits
  - Mandatory validation profiles and app-start verification checks before accepting changes
use_cases:
  - Structuring multi-step AI coding tasks with explicit specs and reviewable diffs
  - Preparing a backlog and scoped changes for existing repositories
