tagline: TypeScript framework for building and deploying MCP servers, with file-based tools, prompts and resources, hot reload and framework adapters.

description: |
  xmcp is an open-source (MIT) TypeScript framework from basement.studio
  for building Model Context Protocol (MCP) servers, the way AI agents and
  chat clients call outside tools and data. A tool is a file: export a
  schema, metadata and a function, and xmcp registers it; prompts and
  resources are discovered the same way. It handles the protocol, input
  validation and transport (HTTP or stdio from the same code).

  It adds middleware, authentication integrations (Better Auth, Clerk,
  Auth0, WorkOS, Descope, Scalekit, Supabase, API keys, JWT), monetization
  plugins (Polar, Commet, x402), MCP Apps with React UI, typed clients for
  external MCP servers, and adapters that run an xmcp server inside
  Next.js, Express, NestJS, Fastify, Hono, TanStack Start, Nuxt, SvelteKit,
  React Router or Astro. Deployment guides cover Vercel, Cloudflare, Alpic,
  Replit, Railway and Render. Its docs are also available to agents through
  a free, read-only MCP server at https://xmcp.dev/mcp. The CLI sends
  anonymous build telemetry by default; set XMCP_TELEMETRY_DISABLED=true to
  turn it off.

features:
  - File-system discovery of tools, prompts and resources, with hot reload
  - HTTP and stdio transports from the same code
  - Middleware and auth integrations (OAuth providers, API keys, JWT)
  - Adapters for Next.js, Express, NestJS, Hono, Nuxt, SvelteKit and more
  - MCP Apps (React UI) and typed clients for external MCP servers
  - Free read-only docs search MCP server at xmcp.dev/mcp

use_cases:
  - Expose an existing TypeScript app's functions to AI agents as MCP tools
  - Add an MCP endpoint to a Next.js or Express app instead of running a separate server
  - Scaffold, test and deploy a new MCP server to Vercel or Cloudflare

