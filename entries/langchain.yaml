tagline: Open-source Python/TypeScript framework for building LLM agents — create_agent harness with middleware, built on LangGraph, with hundreds of integrations.

description: |
  LangChain is an open-source framework for building agents and LLM
  applications in Python and TypeScript. In the 1.x line its centre is
  `create_agent`, a minimal, configurable agent harness composed from a
  model, tools, a system prompt and middleware. Middleware covers things
  like guardrails, retries, routing and tool policies. The framework
  keeps hundreds of integrations with model providers, vector stores and
  tools.

  LangChain agents are built on top of LangGraph, the lower-level
  orchestration runtime, so they inherit durable execution, persistence
  and human-in-the-loop support. Deep Agents, built on LangChain agents,
  is the batteries-included option with context compression, a virtual
  filesystem and subagents. LangSmith is the company's commercial
  platform for tracing, evaluation and deployment.

  All LangChain, LangGraph and LangSmith docs live at docs.langchain.com,
  which publishes both llms.txt and a single llms-full.txt.

features:
  - create_agent harness with composable middleware
  - Hundreds of integrations (OpenAI, Anthropic, Google, local models, vector DBs, tools)
  - Built on LangGraph (durable execution, persistence, human-in-the-loop)
  - Deep Agents for batteries-included long-running agents
  - RAG and structured-output primitives
  - LangSmith tracing and evaluation hooks
  - Python and TypeScript implementations

use_cases:
  - RAG applications over internal document collections
  - Chatbots with multi-turn memory and tool use
  - Structured data extraction from unstructured text
  - Orchestrating multiple LLM calls with parsing and validation between
  - Rapid prototyping of LLM-powered features
  - Teaching / learning LLM application patterns

